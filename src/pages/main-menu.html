<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fallow - Your Garden</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <div class="container">
    <div class="main-menu-container">
      <!-- Top section - Sky blue (2/3) -->
      <div class="sky-section">
        <!-- Top right buttons -->
        <div class="top-right-buttons">
          <button class="btn-icon" id="settings-btn" title="Settings">⚙️</button>
          <button class="btn-icon" id="shop-btn" title="Shop">🏪</button>
        </div>
      </div>

      <!-- Bottom section - Field (1/3) -->
      <div class="field-section">
        <!-- ========================================
             ASSET PLACEHOLDER - PLANT BUTTONS
             Replace these buttons with your custom plant images
             Each button represents a category:
             1. Sleep Tracking (left plant)
             2. Journaling (middle plant)
             3. Pomodoro Timer (right plant)

             You can replace the entire .plant-button div with an image element
             and maintain the same click handlers

             ANIMATION PLACEHOLDER - PLANT HEALTH
             Add classes .plant-dying or .plant-dead based on user activity
             Use these classes to trigger your custom dying/dead plant animations
             ======================================== -->
        <button class="plant-button plant-healthy" id="sleep-btn">
          <div style="font-size: 32px; margin-bottom: 10px;">🌙</div>
          <span data-translate="sleep-tracking">Sleep Tracking</span>
        </button>

        <button class="plant-button plant-healthy" id="journal-btn">
          <div style="font-size: 32px; margin-bottom: 10px;">📝</div>
          <span data-translate="journaling">Journaling</span>
        </button>

        <button class="plant-button plant-healthy" id="pomodoro-btn">
          <div style="font-size: 32px; margin-bottom: 10px;">⏱️</div>
          <span data-translate="pomodoro">Pomodoro</span>
        </button>
      </div>
    </div>
  </div>

  <script src="../js/language.js"></script>
  <script>
    // Navigation handlers
    document.getElementById('settings-btn').addEventListener('click', function() {
      window.location.href = 'settings.html';
    });

    document.getElementById('shop-btn').addEventListener('click', function() {
      window.location.href = 'shop.html';
    });

    document.getElementById('sleep-btn').addEventListener('click', function() {
      window.location.href = 'sleep.html';
    });

    document.getElementById('journal-btn').addEventListener('click', function() {
      window.location.href = 'journal.html';
    });

    document.getElementById('pomodoro-btn').addEventListener('click', function() {
      window.location.href = 'pomodoro.html';
    });

    // TODO: Add plant health check system
    // Check user activity and update plant classes (.plant-healthy, .plant-dying, .plant-dead)
    // Example logic:
    // - If user hasn't visited a category in 3 days: add .plant-dying
    // - If user hasn't visited in 7 days: add .plant-dead
    // - Remove healthy class and add your custom animations
  </script>
</body>
</html>
