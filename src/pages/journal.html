<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fallow - Journal</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <div class="container">
    <div class="feature-container">
      <div class="feature-header">
        <button class="btn-back" id="back-btn">←</button>
        <h2 class="feature-title" data-translate="journaling">Daily Journal</h2>
      </div>

      <div class="feature-content">
        <!-- Daily Motivational Quote -->
        <div class="motivational-quote" id="daily-quote">
          "The greatest glory in living lies not in never falling, but in rising every time we fall."
          <div style="text-align: right; margin-top: 10px; font-size: 12px; font-weight: bold;">
            — Nelson Mandela
          </div>
        </div>

        <!-- Journal Entry Area -->
        <div>
          <h3 style="font-size: 18px; color: #2c5f2d; margin-bottom: 10px;" data-translate="todays-entry">
            Today's Entry
          </h3>
          <textarea
            class="journal-input"
            id="journal-text"
            placeholder="What's on your mind today? Write freely..."
            data-translate-placeholder="journal-placeholder"
          ></textarea>
          <button class="btn-save" id="save-journal" data-translate="save-entry">Save Entry</button>
        </div>

        <div style="margin-top: 20px; font-size: 13px; color: #777;">
          <span data-translate="last-saved">Last saved:</span>
          <span id="last-saved-time">Never</span>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/language.js"></script>
  <script src="../js/journal.js"></script>
</body>
</html>
